<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmation | RailBook</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">RailBook</div>

        <nav>
            <a href="my-bookings.html">My Bookings</a>
            <a href="../index.html">Home</a>
            <a href="trains.html">Book Tickets</a>
        </nav>

    </header>


    <section class="confirmation-section">

        <div class="success-icon">✓</div>

        <h1>Booking Confirmed!</h1>

        <p>Your booking details are shown below.</p>


        <div class="confirmation-card">

            <h2>Booking Details</h2>

            <p><strong>Booking ID:</strong> <span id="booking-id"></span></p>

            <p><strong>Passenger:</strong> <span id="confirm-name"></span></p>

            <p><strong>Train:</strong> <span id="confirm-train"></span></p>

            <p><strong>Seats:</strong> <span id="confirm-seats"></span></p>

            <p><strong>Ticket Price:</strong> <span id="confirm-price"></span></p>

            <p><strong>Total Price:</strong> <span id="confirm-total"></span></p>

            <p><strong>Booking Date:</strong> <span id="confirm-date"></span></p>

        </div>


        <a href="../index.html" class="home-btn">
            Back to Home
        </a>

    </section>


    <script src="../script.js"></script>

</body>

</html>
